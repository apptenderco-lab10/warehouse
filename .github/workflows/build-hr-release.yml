name: Build APP HR Online v1.6.0

on:
  workflow_dispatch:
  push:
    branches: [app-hr-online]
    paths:
      - "app/**"
      - ".github/workflows/build-hr-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout HR branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk APP-HR-Online-v1.6.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP-HR-Online-v1.6.0
          path: APP-HR-Online-v1.6.0.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-hr-v1.6.0
          name: APP HR Online v1.6.0
          target_commitish: app-hr-online
          body: |
            APP HR Online v1.6.0
            - Purchase request module
            - User/group purchase permissions
            - Purchase management panel
            - Real XLSX export for HR and purchase requests
          files: APP-HR-Online-v1.6.0.apk
