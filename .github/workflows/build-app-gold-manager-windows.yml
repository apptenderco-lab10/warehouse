name: Build APP 20 Manager Windows

on:
  workflow_dispatch:
  push:
    branches: [app-gold]
    paths:
      - "windows-manager/**"
      - ".github/workflows/build-app-gold-manager-windows.yml"

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify APP 20 Manager source
        shell: pwsh
        run: |
          $html = Get-Content -Raw -Encoding UTF8 "windows-manager/www/index.html"
          $required = @(
            "APP 20",
            'data-p="me">🏠 صفحه اصلی',
            'data-p="requests">📝 درخواست‌ها',
            'id="personalMessageHome"',
            'id="myLoanTotal"',
            'id="myLoanInstallment"',
            'id="myLoanRemaining"',
            'id="loanReceiveMonth"',
            'id="loanLastMonth"',
            'id="saveLoan"',
            'id="savePersonalMessage"',
            "employee_loans",
            "employee_personal_messages",
            'id="submitSinglePurchase"',
            "تاریخچه اقلام خرید"
          )
          foreach ($marker in $required) {
            if (-not $html.Contains($marker)) { throw "Missing marker: $marker" }
          }
          $homeStart=$html.IndexOf('<section id="me"')
          $reqStart=$html.IndexOf('<section id="requests"')
          if ($homeStart -lt 0 -or $reqStart -lt 0) { throw "Home/request sections missing" }
          $homeHtml=$html.Substring($homeStart,$reqStart-$homeStart)
          if ($homeHtml.Contains('id="type"') -or $homeHtml.Contains('id="send"')) { throw "Request form still on home" }
          if ($html.Contains('id="financeLoan"')) { throw "Legacy monthly loan input present" }
          $pkg=Get-Content -Raw -Encoding UTF8 "windows-manager/package.json" | ConvertFrom-Json
          if ($pkg.version -ne "20.0.0") { throw "Wrong version" }
          if ($pkg.build.appId -ne "com.alppco.appgold.manager.windows") { throw "Wrong appId" }
          if ($pkg.build.productName -ne "APP 20 Manager") { throw "Wrong product name" }
          Write-Host "SOURCE_MARKERS_OK"

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          node --check windows-manager/main.js
          node --check windows-manager/preload.js
          $html=Get-Content -Raw -Encoding UTF8 "windows-manager/www/index.html"
          $m=[regex]::Match($html,'<script>([\s\S]*?)</script>')
          if (-not $m.Success) { throw "Inline script not found" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\app20-manager.js",$m.Groups[1].Value,[Text.UTF8Encoding]::new($false))
          node --check "$env:RUNNER_TEMP\app20-manager.js"
          Write-Host "JS_SYNTAX_OK"

      - name: Browser-level UI self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\app20-win-test" | Out-Null
          Set-Location "$env:RUNNER_TEMP\app20-win-test"
          npm init -y | Out-Null
          npm install --no-audit --no-fund jsdom@26.1.0 | Out-Null
          @'
          import fs from 'fs';
          import {JSDOM} from 'jsdom';
          import {TextEncoder,TextDecoder} from 'util';
          const html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/windows-manager/www/index.html','utf8');
          const dom=new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://appassets.androidplatform.net/assets/www/index.html#selftest',
            pretendToBeVisual:true,
            beforeParse(window){
              window.TextEncoder=TextEncoder;
              window.TextDecoder=TextDecoder;
              window.confirm=()=>true;
              window.alert=()=>{};
              window.fetch=async()=>({ok:false,status:500,text:async()=>'',json:async()=>({})});
            }
          });
          await new Promise(r=>setTimeout(r,850));
          const result=dom.window.document.getElementById('selftest')?.textContent;
          if(result!=='SELFTEST_OK') throw new Error('UI self-test failed: '+result);
          if(!dom.window.document.getElementById('saveLoan')) throw new Error('Loan manager missing');
          if(!dom.window.document.getElementById('savePersonalMessage')) throw new Error('Personal message manager missing');
          console.log('APP20_WINDOWS_UI_SELFTEST_OK');
          dom.window.close();
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\app20-win-test\test.mjs"
          node "$env:RUNNER_TEMP\app20-win-test\test.mjs"

      - name: Install pinned dependencies
        working-directory: windows-manager
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: windows-manager
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Validate installer and packaged app
        shell: pwsh
        run: |
          $installer=Get-Item "windows-manager/dist/APP-20-Manager-Windows-Setup.exe" -ErrorAction Stop
          if ($installer.Length -lt 50000000) { throw "Installer unexpectedly small: $($installer.Length)" }
          $packed=Get-Item "windows-manager/dist/win-unpacked/APP 20 Manager.exe" -ErrorAction Stop
          if ($packed.Length -lt 50000000) { throw "Packaged EXE unexpectedly small: $($packed.Length)" }
          $asar="windows-manager/dist/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) { throw "app.asar missing" }
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  APP-20-Manager-Windows-Setup.exe" | Set-Content -Encoding ascii "windows-manager/dist/APP-20-Manager-Windows-Setup.exe.sha256"
          Write-Host "BUILD_VALIDATION_OK size=$($installer.Length) sha256=$hash"

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $exe=(Resolve-Path "windows-manager/dist/win-unpacked/APP 20 Manager.exe").Path
          $p=Start-Process -FilePath $exe -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "APP 20 Manager exited during smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "RUNTIME_SMOKE_OK"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP-20-Manager-Windows
          path: |
            windows-manager/dist/APP-20-Manager-Windows-Setup.exe
            windows-manager/dist/APP-20-Manager-Windows-Setup.exe.sha256
          retention-days: 90

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-20-manager-windows
          name: APP 20 Manager — Windows
          target_commitish: app-gold
          body: |
            APP 20 Manager Windows
            - Loan amount and loan received month
            - Installment start and final deduction month
            - Automatic current installment and remaining loan calculation
            - Monthly advance management
            - Per-employee reward / praise / warning / personal messages
            - New motivational employee home
            - Simplified purchase workflow and Excel history retained

            Installer is not commercially code-signed; Windows SmartScreen may show Unknown Publisher.
          files: |
            windows-manager/dist/APP-20-Manager-Windows-Setup.exe
            windows-manager/dist/APP-20-Manager-Windows-Setup.exe.sha256
