plugins {
    id "com.android.application"
}

android {
    namespace "com.alppco.intermediatestock"
    compileSdk 35

    defaultConfig {
        applicationId "com.alppco.appgold"
        minSdk 24
        targetSdk 35
        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
