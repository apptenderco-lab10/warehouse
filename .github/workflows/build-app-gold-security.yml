name: Build APP Gold Security Android v2.1.0

on:
  workflow_dispatch:
  push:
    branches: [app-gold]
    paths:
      - "app/**"
      - ".github/workflows/build-app-gold-security.yml"

permissions:
  contents: read

jobs:
  security-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify security markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle").read_text(encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          main = Path("app/src/main/java/com/alppco/intermediatestock/MainActivity.java").read_text(encoding="utf-8")
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          required = {
              "R8": "minifyEnabled true" in gradle and "shrinkResources true" in gradle,
              "release-not-debuggable": "debuggable false" in gradle,
              "pinned-webkit": 'androidx.webkit:webkit:1.17.0' in gradle,
              "no-cleartext": 'android:usesCleartextTraffic="false"' in manifest,
              "network-security-config": 'android:networkSecurityConfig="@xml/network_security_config"' in manifest,
              "webview-debug-off": "setWebContentsDebuggingEnabled(false)" in main,
              "asset-loader": "WebViewAssetLoader" in main,
              "file-access-off": "setAllowFileAccess(false)" in main,
              "universal-file-access-off": "setAllowUniversalAccessFromFileURLs(false)" in main,
              "mixed-content-off": "MIXED_CONTENT_NEVER_ALLOW" in main,
              "no-plaintext-session-copy": "Intentionally no-op" in main,
              "csp": 'Content-Security-Policy' in html,
          }
          bad=[k for k,v in required.items() if not v]
          if bad:
              raise SystemExit("Missing security controls: "+", ".join(bad))
          print("SECURITY_MARKERS_OK")
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",s,re.S)
          if not scripts:
              raise SystemExit("No inline script")
          Path("/tmp/app-gold-security.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/app-gold-security.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build hardened release
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release outputs
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)"
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          if [ "$(stat -c%s "$APK")" -lt 50000 ]; then
            echo "APK unexpectedly small"
            exit 1
          fi
          cp "$APK" APP-Gold-Security-v2.1.0-unsigned.apk
          cp app/build/outputs/mapping/release/mapping.txt APP-Gold-Security-v2.1.0-mapping.txt
          sha256sum APP-Gold-Security-v2.1.0-unsigned.apk > APP-Gold-Security-v2.1.0-unsigned.apk.sha256
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
          echo "HARDENED_RELEASE_OK"

      - name: Upload unsigned hardened release
        uses: actions/upload-artifact@v4
        with:
          name: APP-Gold-Security-v2.1.0-unsigned
          path: |
            APP-Gold-Security-v2.1.0-unsigned.apk
            APP-Gold-Security-v2.1.0-unsigned.apk.sha256
            APP-Gold-Security-v2.1.0-mapping.txt
            signing-tools/**
          retention-days: 30
