name: Build APP Gold Secure v2.1.0

on:
  workflow_dispatch:
  push:
    branches: [app-gold-secure]
    paths:
      - "app/**"
      - ".github/workflows/build-app-gold-secure.yml"

permissions:
  contents: read

jobs:
  harden-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout secure branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      - name: Verify source hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle").read_text(encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          java = Path("app/src/main/java/com/alppco/intermediatestock/MainActivity.java").read_text(encoding="utf-8")
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")

          required_gradle = [
              'applicationId "com.alppco.appgold.secure"',
              'versionName "2.1.0"',
              'minifyEnabled true',
              'shrinkResources true',
              'debuggable false',
              'androidx.webkit:webkit:1.17.0',
          ]
          required_manifest = [
              'android:allowBackup="false"',
              'android:usesCleartextTraffic="false"',
              'android:networkSecurityConfig="@xml/network_security_config"',
          ]
          required_java = [
              'WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG)',
              'settings.setAllowFileAccess(false)',
              'settings.setAllowContentAccess(false)',
              'settings.setAllowUniversalAccessFromFileURLs(false)',
              'WebSettings.MIXED_CONTENT_NEVER_ALLOW',
              'EXPECTED_CERT_SHA256',
              'appassets.androidplatform.net',
          ]
          required_html = [
              'Content-Security-Policy',
              'APP Gold Secure v2.1.0',
              'APP_GOLD_SECURE_SESSION_V1',
          ]
          for label, body, markers in [
              ("gradle", gradle, required_gradle),
              ("manifest", manifest, required_manifest),
              ("java", java, required_java),
              ("html", html, required_html),
          ]:
              missing = [m for m in markers if m not in body]
              if missing:
                  raise SystemExit(f"{label} missing: {missing}")

          forbidden = ['sb_secret_', 'SUPABASE_SERVICE_ROLE_KEY', 'service_role']
          combined = gradle + manifest + java + html
          leaked = [x for x in forbidden if x in combined]
          if leaked:
              raise SystemExit(f"secret marker found in client: {leaked}")
          print("SOURCE_SECURITY_CHECKS_OK")
          PY

      - name: Minify and mangle bundled web code
        shell: bash
        run: |
          npm install --no-save --ignore-scripts terser@5.51.2 html-minifier-terser@7.2.0
          node <<'NODE'
          const fs = require('fs');
          const { minify: minifyJs } = require('terser');
          const { minify: minifyHtml } = require('html-minifier-terser');

          (async () => {
            const path = 'app/src/main/assets/www/index.html';
            let html = fs.readFileSync(path, 'utf8');
            const match = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!match) throw new Error('inline script not found');

            const out = await minifyJs(match[1], {
              compress: { passes: 2, drop_console: true },
              mangle: true,
              format: { comments: false }
            });
            if (!out.code) throw new Error('terser produced no output');

            html = html.replace(match[0], '<script>' + out.code + '</script>');
            html = await minifyHtml(html, {
              collapseWhitespace: true,
              removeComments: true,
              minifyCSS: true,
              minifyJS: false,
              removeRedundantAttributes: true,
              keepClosingSlash: true
            });
            fs.writeFileSync(path, html, 'utf8');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>(.*?)</script>", html, re.S)
          if not m:
              raise SystemExit("minified script missing")
          Path("/tmp/app-gold-secure.js").write_text(m.group(1), encoding="utf-8")
          if "function renderPeople" in m.group(1):
              raise SystemExit("JavaScript was not mangled/minified")
          if "Content-Security-Policy" not in html:
              raise SystemExit("CSP missing after minification")
          print("WEB_HARDENING_OK", len(html))
          PY
          node --check /tmp/app-gold-secure.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate release artifact and R8
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          test -s "app/build/outputs/mapping/release/mapping.txt"
          test -s "app/build/outputs/mapping/release/configuration.txt"

          unzip -p "$APK" assets/www/index.html > /tmp/index-secure.html
          test -s /tmp/index-secure.html
          grep -q "Content-Security-Policy" /tmp/index-secure.html
          grep -q "APP_GOLD_SECURE_SESSION_V1" /tmp/index-secure.html
          if grep -q "function renderPeople" /tmp/index-secure.html; then
            echo "Readable JS function names still present"
            exit 1
          fi
          if grep -Eq "sb_secret_|SUPABASE_SERVICE_ROLE_KEY|service_role" /tmp/index-secure.html; then
            echo "Secret marker found in packaged client"
            exit 1
          fi

          cp "$APK" APP-Gold-Secure-v2.1.0-UNSIGNED.apk
          sha256sum APP-Gold-Secure-v2.1.0-UNSIGNED.apk > APP-Gold-Secure-v2.1.0-UNSIGNED.apk.sha256
          echo "UNSIGNED_RELEASE_OK"

      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: APP-Gold-Secure-v2.1.0-unsigned
          path: |
            APP-Gold-Secure-v2.1.0-UNSIGNED.apk
            APP-Gold-Secure-v2.1.0-UNSIGNED.apk.sha256
          retention-days: 7
