name: Build APP Gold Android v2.3.0

on:
  workflow_dispatch:
  push:
    branches: [app-gold]
    paths:
      - "app/**"
      - "supabase/**"
      - ".github/workflows/build-app-gold.yml"

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout APP Gold
        uses: actions/checkout@v4

      - name: Verify APP Gold source markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")
          required = [
              "APP Gold",
              'id="rewards"',
              'id="tenureText"',
              'id="rewardLevel"',
              'id="rewardScore"',
              'id="goldM"',
              "تولید تیوب نسوز",
              "تولید هد سمپلر",
              "تولید کابل",
              "تولید لنس",
              "حضور ارزشمند شما ضامن سعادت تمامی پرسنل می‌باشد.",
              "reward_history",
              "hire_date",
              "work_sections",
              'id="openBuyItemPicker"',
              "تاریخچه اقلام خرید",
              "autoFilter",
              'id="financeMonthCard"',
              'id="myAdvanceAmount"',
              'id="myLoanAmount"',
              "employee_monthly_finance",
              'id="submitSinglePurchase"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing APP Gold markers: " + repr(missing))
          if 'id="accDept"' in s:
              raise SystemExit("Legacy free-text department field still exists")
          print("SOURCE_MARKERS_OK")
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", s, re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/app-gold.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/app-gold.js
          echo "JS_SYNTAX_OK"

      - name: Browser-level UI self-test
        shell: bash
        run: |
          mkdir -p /tmp/appgold-staff-test
          cd /tmp/appgold-staff-test
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund jsdom@26.1.0 >/dev/null
          cat > test.mjs <<'JS'
          import fs from 'fs';
          import {JSDOM} from 'jsdom';
          import {TextEncoder,TextDecoder} from 'util';
          const html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/app/src/main/assets/www/index.html','utf8');
          const dom=new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://appassets.androidplatform.net/assets/www/index.html#selftest',
            pretendToBeVisual:true,
            beforeParse(window){
              window.TextEncoder=TextEncoder;
              window.TextDecoder=TextDecoder;
              window.confirm=()=>true;
              window.alert=()=>{};
              window.fetch=async()=>({ok:false,status:500,text:async()=>'',json:async()=>({})});
            }
          });
          await new Promise(r=>setTimeout(r,700));
          const result=dom.window.document.getElementById('selftest')?.textContent;
          if(result!=='SELFTEST_OK') throw new Error('UI self-test failed: '+result);
          if(dom.window.document.getElementById('addBuyBasket')) throw new Error('Old basket flow still exists');
          console.log('STAFF_UI_SELFTEST_OK');
          dom.window.close();
          JS
          node test.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleStaffDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/staff/debug/app-staff-debug.apk
          cp app/build/outputs/apk/staff/debug/app-staff-debug.apk APP-Gold-v2.3.0.apk
          sha256sum APP-Gold-v2.3.0.apk > APP-Gold-v2.3.0.apk.sha256
          echo "APK_OK"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP-Gold-v2.3.0
          path: |
            APP-Gold-v2.3.0.apk
            APP-Gold-v2.3.0.apk.sha256
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-gold-v2.3.0
          name: APP Gold v2.3.0
          target_commitish: app-gold
          body: |
            APP Gold v2.3.0
            - Gold / Silver / Bronze / No-level reward area
            - Manual reward score controlled by management
            - Up to two work sections per employee
            - Hire date and live team-tenure message
            - Reward change history
            - Purchase request flow simplified to one item / one submit button
            - Large readable purchase controls with searchable item picker
            - Background refresh preserves the selected item
            - Current-month advance and loan totals shown in large type on the first page
            - Automatic Jalali month rollover: a new month starts at zero until management enters values
            - Excel includes request date and a filterable item-history sheet
            - Existing HR, announcements and purchase modules preserved
            - New Android application id for safe side-by-side installation
          files: |
            APP-Gold-v2.3.0.apk
            APP-Gold-v2.3.0.apk.sha256
