name: Build APP 20 Android

on:
  workflow_dispatch:
  push:
    branches: [app-gold]
    paths:
      - "app/**"
      - "supabase/**"
      - ".github/workflows/build-app-gold.yml"

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout APP 20
        uses: actions/checkout@v4

      - name: Verify APP 20 source markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          required=[
            "APP 20",
            'data-p="me">🏠 صفحه اصلی',
            'data-p="requests">📝 درخواست‌ها',
            'id="personalMessageHome"',
            'id="myAdvanceAmount"',
            'id="myLoanTotal"',
            'id="myLoanInstallment"',
            'id="myLoanRemaining"',
            'id="loanReceiveMonth"',
            'id="loanLastMonth"',
            'id="saveLoan"',
            'id="savePersonalMessage"',
            "employee_loans",
            "employee_personal_messages",
            'id="submitSinglePurchase"',
            "تاریخچه اقلام خرید",
            "APP Gold",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing APP 20 markers: "+repr(missing))
          home=s[s.index('<section id="me"'):s.index('<section id="requests"')]
          if 'id="type"' in home or 'id="send"' in home:
              raise SystemExit("Request form still appears on employee home")
          if 'id="financeLoan"' in s:
              raise SystemExit("Legacy manual monthly-loan input still exists")
          print("SOURCE_MARKERS_OK")
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",s,re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/app20.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/app20.js
          echo "JS_SYNTAX_OK"

      - name: Browser-level APP 20 self-test
        shell: bash
        run: |
          mkdir -p /tmp/app20-test
          cd /tmp/app20-test
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund jsdom@26.1.0 >/dev/null
          cat > test.mjs <<'JS'
          import fs from 'fs';
          import {JSDOM} from 'jsdom';
          import {TextEncoder,TextDecoder} from 'util';
          const html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/app/src/main/assets/www/index.html','utf8');
          const dom=new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://appassets.androidplatform.net/assets/www/index.html#selftest',
            pretendToBeVisual:true,
            beforeParse(window){
              window.TextEncoder=TextEncoder;
              window.TextDecoder=TextDecoder;
              window.confirm=()=>true;
              window.alert=()=>{};
              window.fetch=async()=>({ok:false,status:500,text:async()=>'',json:async()=>({})});
            }
          });
          await new Promise(r=>setTimeout(r,850));
          const result=dom.window.document.getElementById('selftest')?.textContent;
          if(result!=='SELFTEST_OK') throw new Error('UI self-test failed: '+result);
          if(!dom.window.document.getElementById('myLoanRemaining')) throw new Error('Loan dashboard missing');
          if(!dom.window.document.getElementById('personalMessageHome')) throw new Error('Personal message missing');
          if(dom.window.document.getElementById('financeLoan')) throw new Error('Legacy monthly loan input present');
          console.log('APP20_UI_SELFTEST_OK');
          dom.window.close();
          JS
          node test.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APP 20 APK
        run: gradle --no-daemon :app:assembleStaffDebug

      - name: Validate APP 20 APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/staff/debug/app-staff-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.alppco.appgold'" /tmp/badging.txt
          grep -q "application-label:'APP 20'" /tmp/badging.txt
          unzip -p "$APK" assets/www/index.html > /tmp/packed-index.html
          grep -q 'id="myLoanRemaining"' /tmp/packed-index.html
          grep -q 'id="personalMessageHome"' /tmp/packed-index.html
          cp "$APK" APP-20-Android.apk
          sha256sum APP-20-Android.apk > APP-20-Android.apk.sha256
          echo "APP20_APK_OK"

      - name: Upload APP 20 artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP-20-Android
          path: |
            APP-20-Android.apk
            APP-20-Android.apk.sha256
          retention-days: 90

      - name: Publish APP 20 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-20-android
          name: APP 20 — Android
          target_commitish: app-gold
          body: |
            APP 20
            - New motivational employee home
            - Personal manager message: reward / praise / warning / personal info
            - Current-month advance in large type
            - Loan amount, current installment and remaining balance
            - Loan received month, installment start month and final deduction month
            - HR requests moved off the home screen into a separate tab
            - APP Gold level and performance score remain visible
            - Simplified purchase request workflow preserved
          files: |
            APP-20-Android.apk
            APP-20-Android.apk.sha256
